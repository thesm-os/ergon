version: "2"

run:
  timeout: 5m
  modules-download-mode: readonly
  allow-parallel-runners: true
  tests: true
  go: "1.26"
  relative-path-mode: gomod

output:
  show-stats: true
  path-mode: "abs"
  sort-order:
    - linter
    - severity
    - file

linters:
  default: none
  enable:
    # Bugs & safety
    - copyloopvar
    - errcheck
    - errorlint
    - exhaustive
    - gosec
    - govet
    - nilerr
    - predeclared
    - staticcheck
    - unused
    - wastedassign
    # Modernization
    - modernize
    - unparam
    # Architecture & style
    - depguard
    - dupword
    - gocritic
    - interfacebloat
    - misspell
    - revive
    - musttag
    - sloglint
    - usestdlibvars
    - nilnil
    - goconst
    # Concurrency
    - asasalint
    - containedctx
    - contextcheck
    - errname
    - whitespace
    # Test hygiene
    - thelper
    - tparallel
    - usetesting

  settings:
    depguard:
      rules:
        # internal/ holds business logic. cobra is the CLI framework
        # and must not leak in.
        internal:
          list-mode: lax
          files:
            - "**/internal/**"
          deny:
            - pkg: "github.com/sirupsen/logrus"
              desc: "use log/slog from stdlib"
            - pkg: "github.com/pkg/errors"
              desc: "use stdlib errors + fmt.Errorf"
            - pkg: "github.com/spf13/cobra"
              desc: "cobra belongs in cmd/ergon/cmds; internal/ must not depend on the CLI framework"
        # cmd/ holds cobra wiring only — no business logic.
        cmd:
          list-mode: lax
          files:
            - "**/cmd/**"
          deny:
            - pkg: "github.com/sirupsen/logrus"
              desc: "use log/slog from stdlib"
            - pkg: "github.com/pkg/errors"
              desc: "use stdlib errors + fmt.Errorf"

    exhaustive:
      default-signifies-exhaustive: true
      check:
        - switch

    usetesting:
      context-background: true
      context-todo: true
      os-setenv: true
      os-mkdir-temp: true
      os-temp-dir: true

    gocritic:
      enabled-tags:
        - diagnostic
      disabled-checks:
        - ifElseChain
        - commentedOutCode

    staticcheck:
      checks:
        - all
        - "-SA1016"
        - "-S1016"

    revive:
      severity: error
      confidence: 0.1
      rules:
        - name: context-as-argument
        - name: var-naming
        - name: package-comments
        - name: receiver-naming
        - name: exported
          severity: warning
        - name: error-return
        - name: error-naming
        - name: error-strings
        - name: errorf
        - name: if-return
        - name: indent-error-flow
        - name: early-return
        - name: unexported-return
        - name: redundant-import-alias
        - name: range
        - name: empty-block
        - name: unnecessary-stmt
        - name: modifies-value-receiver
        - name: time-naming
        - name: unused-receiver

    govet:
      enable-all: true

    interfacebloat:
      max: 10

    asasalint:
      use-builtin-exclusions: true

    copyloopvar:
      check-alias: true

    whitespace:
      multi-if: true
      multi-func: false

  exclusions:
    generated: lax
    paths:
      - docs
    presets:
      - std-error-handling
      - common-false-positives
    rules:
      # Tests legitimately use goconst-tripping repeated strings and
      # may return (nil, nil) from stubs.
      - path: '(_test\.go|testutil/|.*test/)'
        linters: [goconst, nilnil, unparam]

      # fieldalignment is noise for a CLI tool — structs are not on hot paths.
      - linters: [govet]
        text: "fieldalignment:"

      # G115: integer overflow on conversion — too many false positives
      # at stdlib boundaries.
      - linters: [gosec]
        text: "G115:"

      # G302: golden file tests intentionally use 0o644.
      - path: '_test\.go'
        linters: [gosec]
        text: "G302:"

formatters:
  enable:
    - gci
    - gofmt
    - gofumpt
    - goimports
    - golines

  settings:
    gci:
      sections:
        - standard
        - default
        - prefix(go.thesmos.sh/ergon)
      custom-order: true
    golines:
      max-len: 120
    gofumpt:
      extra-rules: true

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
  fix: false

severity:
  default: error
