name: CI
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    strategy:
      # Run every OS regardless of others failing so a windows-only
      # regression doesn't mask a macos one.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: go test
        run: go test -race -count=1 ./...

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - uses: golangci/golangci-lint-action@v8
        with:
          version: latest
          args: --timeout=5m

  dogfood:
    runs-on: ubuntu-latest
    needs: [test, lint]
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Build ergon
        run: go build -o /usr/local/bin/ergon ./cmd/ergon
      # `ergon bootstrap` installs every external binary ergon
      # invokes (govulncheck, golangci-lint, gofumpt, gci,
      # go-license, benchstat, gremlins). The dogfood job exercises
      # the binary against its own repo so it must be able to run
      # the gates that shell out — running bootstrap here doubles
      # as a smoke test of the bootstrap command itself.
      - name: ergon bootstrap
        run: ergon bootstrap
      - name: Ensure GOBIN is on PATH
        run: echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: ergon mod verify
        run: ergon mod verify
      - name: ergon lint vet
        run: ergon lint vet
      - name: ergon lint skip-expiry
        run: ergon lint skip-expiry
      - name: ergon lint error-prefix
        run: ergon lint error-prefix
      - name: ergon lint vuln
        run: ergon lint vuln
