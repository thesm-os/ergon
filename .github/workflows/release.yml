name: Release
on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write
  id-token: write  # cosign keyless signing reads OIDC tokens

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    outputs:
      # base64-encoded sha256sum-format digest list, consumed by the
      # SLSA provenance job below. goreleaser already produces this
      # exact format in dist/checksums.txt — we just base64 it.
      hashes: ${{ steps.hash.outputs.hashes }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - uses: sigstore/cosign-installer@v3
      # UPX is invoked by the goreleaser config's post-build hook
      # (linux + windows_amd64 targets). Without this step the
      # hook silently exits non-zero because `upx` is not on the
      # ubuntu-latest runner by default; goreleaser logs but
      # continues, so released binaries end up un-packed.
      - name: Install UPX
        run: sudo apt-get update && sudo apt-get install -y upx
      - uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Cross-repo PAT with contents:write on thesm-os/homebrew-tap;
          # goreleaser's homebrew_casks block uses it to bump the
          # cask file on every non-prerelease tag.
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
      - name: Compute artifact digests for SLSA provenance
        id: hash
        # The SLSA generic generator expects `sha256sum`-format lines
        # ("<hex> <name>\n"), base64-encoded with no wrapping. That's
        # exactly the layout of goreleaser's checksums.txt.
        run: |
          cd dist
          echo "hashes=$(base64 -w0 < checksums.txt)" >> "$GITHUB_OUTPUT"

  # SLSA Build L3 provenance attestation. The reusable workflow needs
  # direct access to the actions runtime / OIDC token for signing, so
  # it runs as its own job. Output is `multiple.intoto.jsonl`,
  # attached to the release; users verify with
  # `slsa-verifier verify-artifact`.
  provenance:
    needs: [goreleaser]
    permissions:
      actions: read       # read the workflow run that built the artifacts
      id-token: write     # mint the OIDC token used to sign the attestation
      contents: write     # upload the attestation to the release
    # MUST be pinned to a full `vX.Y.Z` tag — slsa-verifier refuses to
    # verify attestations produced by float / commit refs.
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.1.0
    with:
      base64-subjects: "${{ needs.goreleaser.outputs.hashes }}"
      upload-assets: true
