name: Release
on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write
  id-token: write  # cosign keyless signing reads OIDC tokens

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - uses: sigstore/cosign-installer@v3
      # UPX is invoked by the goreleaser config's post-build hook
      # (linux + windows_amd64 targets). Without this step the
      # hook silently exits non-zero because `upx` is not on the
      # ubuntu-latest runner by default; goreleaser logs but
      # continues, so released binaries end up un-packed.
      - name: Install UPX
        run: sudo apt-get update && sudo apt-get install -y upx
      - uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Cross-repo PAT with contents:write on thesm-os/homebrew-tap;
          # goreleaser's homebrew_casks block uses it to bump the
          # cask file on every non-prerelease tag.
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
