# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2

project_name: ergon

before:
  hooks:
    - go vet ./...

builds:
  - id: ergon
    dir: .
    main: ./cmd/ergon
    binary: ergon
    env:
      - CGO_ENABLED=0
    mod_timestamp: '{{ .CommitTimestamp }}'
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X go.thesmos.sh/ergon/internal/version.buildVersion={{.Version}}
      - -X go.thesmos.sh/ergon/internal/version.buildCommit={{.Commit}}
      - -X go.thesmos.sh/ergon/internal/version.buildDate={{.CommitDate}}
    hooks:
      post:
        - cmd: sh -c 'case "{{ .Target }}" in linux_*|windows_amd64_*) exec upx --best --lzma "{{ .Path }}" ;; esac'
          output: true

archives:
  - id: default
    formats: ['tar.gz']
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    format_overrides:
      - goos: windows
        formats: ['zip']

source:
  enabled: true
  name_template: '{{ .ProjectName }}_{{ .Version }}_source'

checksum:
  name_template: checksums.txt
  algorithm: sha256

signs:
  - cmd: cosign
    signature: '${artifact}.sig'
    certificate: '${artifact}.pem'
    args:
      - sign-blob
      - '--output-signature=${signature}'
      - '--output-certificate=${certificate}'
      - '${artifact}'
      - '--yes'
    artifacts: checksum
    output: true

changelog:
  sort: asc
  use: github
  groups:
    - title: New features
      regexp: '^feat'
      order: 0
    - title: Performance
      regexp: '^perf'
      order: 1
    - title: Bug fixes
      regexp: '^fix'
      order: 2
    - title: Test rigor
      regexp: '^test'
      order: 3
    - title: Refactors
      regexp: '^refactor'
      order: 4
    - title: Other
      order: 999
  filters:
    exclude:
      - '^docs'
      - '^ci'
      - '^chore'
      - '^build'
      - '^style'
      - 'Merge pull request'
      - 'Merge branch'

homebrew_casks:
  - name: ergon
    # CLI binary inside the cask — goreleaser unpacks the archive
    # and links binaries[0] into Homebrew's bin/.
    binaries:
      - ergon
    homepage: 'https://github.com/thesm-os/ergon'
    description: 'Task runner for Go projects: bootstrap, format, lint, test, bench, release, and a multi-stage check umbrella.'
    # Run `ergon completion <shell>` at install time and install the
    # output into Homebrew's shell-completion dirs. `shell_parameter_format: cobra`
    # tells goreleaser to pass the shell name as a positional arg,
    # matching cobra's `completion bash|zsh|fish|powershell` form.
    generate_completions_from_executable:
      args:
        - completion
      shell_parameter_format: cobra
      shells:
        - bash
        - zsh
        - fish
        - pwsh
    # Without this hook, `brew install --cask` leaves
    # `com.apple.quarantine` on the binary; Gatekeeper then SIGKILLs
    # the Mach-O at exec on Apple Silicon. (Cask's
    # auto-quarantine-removal only fires for `app`/`pkg` artifact
    # types, not `binary`.) Stripping it in post-install is the
    # documented workaround until we ship Developer-ID-signed +
    # notarized binaries.
    hooks:
      post:
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/ergon"]
          end
    # Tap repo lives at github.com/thesm-os/homebrew-tap.
    # Cross-repo writes need a PAT with contents:write on the tap;
    # the release workflow exposes it as $HOMEBREW_TAP_TOKEN.
    repository:
      owner: thesm-os
      name: homebrew-tap
      branch: main
      token: '{{ .Env.HOMEBREW_TAP_TOKEN }}'
    commit_author:
      name: goreleaser-bot
      email: bot@thesmos.sh
    commit_msg_template: 'brew: bump {{ .ProjectName }} to {{ .Tag }}'
    # Skip prereleases (anything with a `-` suffix, e.g. v1.0.0-rc1).
    skip_upload: auto

release:
  github:
    owner: thesm-os
    name: ergon
  draft: false
  prerelease: auto
  footer: |
    **Full changelog:** https://github.com/thesm-os/ergon/compare/{{ .PreviousTag }}...{{ .Tag }}

report_sizes: true
