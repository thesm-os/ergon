# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2

project_name: ergon

before:
  hooks:
    - go vet ./...

builds:
  - id: ergon
    dir: .
    main: ./cmd/ergon
    binary: ergon
    env:
      - CGO_ENABLED=0
    mod_timestamp: '{{ .CommitTimestamp }}'
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X go.thesmos.sh/ergon/internal/version.buildVersion={{.Version}}
      - -X go.thesmos.sh/ergon/internal/version.buildCommit={{.Commit}}
      - -X go.thesmos.sh/ergon/internal/version.buildDate={{.CommitDate}}
    hooks:
      post:
        - cmd: sh -c 'case "{{ .Target }}" in linux_*|windows_amd64_*) exec upx --best --lzma "{{ .Path }}" ;; esac'
          output: true

archives:
  - id: default
    formats: ['tar.gz']
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    format_overrides:
      - goos: windows
        formats: ['zip']

source:
  enabled: true
  name_template: '{{ .ProjectName }}_{{ .Version }}_source'

checksum:
  name_template: checksums.txt
  algorithm: sha256

signs:
  - cmd: cosign
    signature: '${artifact}.sig'
    certificate: '${artifact}.pem'
    args:
      - sign-blob
      - '--output-signature=${signature}'
      - '--output-certificate=${certificate}'
      - '${artifact}'
      - '--yes'
    artifacts: checksum
    output: true

changelog:
  sort: asc
  use: github
  groups:
    - title: New features
      regexp: '^feat'
      order: 0
    - title: Performance
      regexp: '^perf'
      order: 1
    - title: Bug fixes
      regexp: '^fix'
      order: 2
    - title: Test rigor
      regexp: '^test'
      order: 3
    - title: Refactors
      regexp: '^refactor'
      order: 4
    - title: Other
      order: 999
  filters:
    exclude:
      - '^docs'
      - '^ci'
      - '^chore'
      - '^build'
      - '^style'
      - 'Merge pull request'
      - 'Merge branch'

release:
  github:
    owner: thesm-os
    name: ergon
  draft: false
  prerelease: auto
  footer: |
    **Full changelog:** https://github.com/thesm-os/ergon/compare/{{ .PreviousTag }}...{{ .Tag }}

report_sizes: true
